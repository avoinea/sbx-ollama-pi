schemaVersion: "2"
kind: sandbox
name: pi
displayName: pi (Ollama)
description: pi coding agent with a local Ollama server, from the sbx-ollama-pi template image.
sourceURL: https://github.com/avoinea/sbx-ollama-pi
licenses:
  - MIT

sandbox:
  image: docker.io/avoinea/sbx-ollama-pi:latest

setup:
  startup:
    - description: Point ~/workspace at the mounted workspace
      command:
        - sh
        - -c
        - >-
          if [ -d "$HOME/workspace" ] && [ ! -L "$HOME/workspace" ] &&
          [ -z "$(ls -A "$HOME/workspace")" ]; then rmdir "$HOME/workspace" &&
          ln -s "$WORKSPACE_DIR" "$HOME/workspace"; fi
